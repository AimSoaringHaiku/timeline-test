- 日付: "2026/05/19"
  見出し: "COPDにおけるICS（吸入ステロイド）の用量制限とベースライン"
  内容: "COPDには肺炎リスク回避のため高用量ステロイドを使用しない。レルベアやテリルジー等はCOPD適応において高用量規格が除外されている。喘息と異なり、治療の土台は気管支拡張（LAMA/LABA）であり、ステロイド無配合が基本となる。"

- 日付: "2026/05/19"
  見出し: "感染症・新型コロナ罹患時におけるICSの継続判断"
  内容: "呼吸器感染症に罹患した場合でも、基礎疾患（喘息やCOPD）の急性増悪を防ぐため、ICSは自己中断せずに継続することが世界的ガイドラインの共通見解である。"

- 日付: "2026/05/19"
  見出し: "肺炎発症時（外来レベル）におけるICSの扱い"
  内容: "肺炎発症時も急激なステロイド離脱による急性増悪を避けるため、即座の完全中止は推奨されない。ただし、肺炎を反復する場合は高用量ICSによる局所免疫低下を疑い、LAMA/LABA等へのステップダウンを検討する。"

- 日付: "2026/05/19"
  見出し: "COPDの病態生理：慢性炎症ループと残存組織"
  内容: "COPD診断時、気道の炎症は終わっておらず慢性的に進行（くすぶり）続けている。気腫化した部分は不可逆的だが残存組織は機能しており、LAMA/LABAで狭くなった気道を広げ、換気能力を引き出すことが治療の根幹である。"

- 日付: "2026/05/19"
  見出し: "COPD患者におけるACOの割合と診断基準の変遷"
  内容: "COPD患者の約15〜30％がACOに該当する。診断基準はガイドライン（GINAやGOLD等）により変遷があるが、アレルギー体質者の喫煙、加齢による遅発性喘息の併発、重症喘息の難治化（リモデリング）などが主な発症ルートとなる。"

- 日付: "2026/05/19"
  見出し: "成人喘息の起源と発症ピーク年齢"
  内容: "成人喘息の約70〜80％は小児期の既往がなく大人になってから新規発症する。特に40代〜60代での発症が半数以上を占め、加齢や感染症、ストレス等が引き金となって突然発症するケースが多い。"
